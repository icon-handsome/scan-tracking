[App]
version=0.1.0
environment=production

[Debug]
; 实测与 PLC 联调时关闭，避免抢占视觉流水线
autoLatencyBundleTestEnabled=false
autoLatencyBundleTestDelayMs=30000
autoLatencyBundleTestPeriodic=false

[Logger]
level=1
; rotateDays 为保留项，程序不会删除历史日志；每日独立文件 logs/scan_tracking_yyyy-MM-dd.txt
rotateDays=0

[Modbus]
host=192.168.8.14
port=501
unitId=1
timeoutMs=1000
reconnectIntervalMs=2000

[Camera]
defaultCamera=Mech-Eye Nano
scanTimeoutMs=5000

[Station]
; 1=第一工位封头（默认）  2=第二工位多模式
stationId=1
stationName=第一工位-封头
; 相对路径相对于 config.ini 所在目录，或相对于 exe 目录（与现有配置查找策略一致）
scanPathsConfigPath=config/scan_paths/station1_default.json
defaultWorkMode=MODE_END_CAP
profileIni=config/station_profiles/station1_endcap.ini

[Vision]
mechEyeCameraKey=192.168.8.20   
mechCaptureTimeoutMs=30000
mechDepthRangeMin=100
mechDepthRangeMax=2000
; 主流程 3D 采集：仅 Noise Removal = Normal（代码固定，不写 Outlier Removal）
; 调试：同次额外采一帧（Noise=Off），落盘 pointcloud_raw / pointcloud_comparison 对比
mechPointCloudProcessingComparisonEnabled=true
hikConnectTimeoutMs=3000
hikCaptureTimeoutMs=1000
; 海康双目 A/B 曝光（微秒），连接相机时写入 SDK
hikExposureTimeUs=50000
hikGain=0
hikSdkRoot=D:/work/LY/deploy_debug
; 以下 GigE 双目 A/B 已废弃，由 hikCxpCameraA/B 替代（主流程不再启动）
;hikCameraAName=hik_camera_a
;hikCameraAKey=192.168.8.12
;hikCameraAIp=192.168.8.12
;hikCameraASerial=
;hikCameraBName=hik_camera_b
;hikCameraBKey=192.168.8.22
;hikCameraBIp=192.168.8.22
;hikCameraBSerial=
hikCameraCName=hik_camera_c
hikCameraCKey=192.168.8.100
hikCameraCIp=192.168.8.100
hikCameraCSerial=
; 海康 C 不走 SDK，以下 accessMode 仅保留配置项，程序不读取
hikCameraCAccessMode=monitor
hikCameraCTcpListenIp=192.168.8.130
hikCameraCTcpListenPort=8999
hikCameraCFtpDirectory=D:/HikCameraFTP

; CH250 CoaXPress（PCIe 采集卡）双目
; IPC 约定：CameraA=LB 左目(imgs1/I1/D1/E1)，CameraB=LB 右目(imgs2/I2/D2/E2)
; 现场：左=DA9122998，右=DA9122997（与 third_party/LB/main.cpp 一致）
hikCxpEnabled=true
hikCxpCaptureTimeoutMs=5000
hikCxpExposureTimeUs=50000
hikCxpGain=0
hikCxpTriggerMode=1
hikCxpSmokeOutputDir=D:/CxpSmokeTest
hikCxpCameraAName=ch250_left
hikCxpCameraAKey=DA9122998
hikCxpCameraASerial=DA9122998
hikCxpCameraBName=ch250_right
hikCxpCameraBKey=DA9122997
hikCxpCameraBSerial=DA9122997

[LbnPose]
enabled=true
; TODO(marker): 转盘未装标记点联调时 true，Rt 用单位阵、不跑 LBN；装标后改 false
useIdentityRtWithoutMarkers=true
dataRoot=D:/work/LY/deploy_debug/data/LBN
templateFile=D:/work/LY/deploy_debug/data/LBN/template-3D-ALL-Shift-Cut-Cut.txt
; 以下参数在 testdata/test scan_150200 离线调通；生产请多工况验证后再收紧，详见 docs/station1/算法使用API.md
minDistance=20
maxDistance=650
cosTolerance=0.05
minPercent=0.2
cloudSearchRadiusPx=20
markerMinArea=200
markerMaxArea=30000
markerIntensityThreshold=40
markerDebscanDistPx=120

[LbPose]
; 算法标定/GeoHash/Recon 参数以 trackConfigFile 为准（算法更新时替换该 ini 即可）
trackConfigFile=third_party/LB/track_config.ini
templateFile=third_party/LB/template_for_scanner_ori.txt
dataRoot=data/LB
leftPattern=
rightPattern=

[FlowControl]
pollIntervalMs=500
heartbeatIntervalMs=1000
simulatedProcessingMs=300
; 正式流程测试：false=执行检测/位姿/点云后处理算法；true=全路径联调（仅采集+PLC握手，跳过算法）
algorithmBypassEnabled=false
; 路径1联调步进：0=全流程不暂停；1=路径1第1点(CXP+梅卡)落盘后暂停；2=第2点暂停… 暂停后改 0 或更大值并重启 IPC 再继续
firstPathPauseAfterPoint=0
; @deprecated 分段点云/海康已改内存缓存；仅 LatencyTest 等调试落盘可读此路径
scanCacheDirectory=
; @deprecated 不再控制分段 PLY 生命周期
retainSegmentPly=true

[SegmentCaptureExport]
enabled=true
outputRoot=output
; true=落盘 PLY（段级 raw/stitched、检测融合点云）；矩阵、CXP 2D、meta 均写入 output/session_*/pathN_segMM/
saveRawPointCloud=true

[PointCloudProcessing]
; Trig_ScanSegment 后 IPC 点云后处理（与 [Vision] mechDepthRange* 相机采集范围独立）
enabled=false
depthMinMm=100
depthMaxMm=700
outlierRemovalEnabled=true
outlierMeanK=50
outlierStddevMul=1.0
smoothingEnabled=true
mlsSearchRadiusMm=5.0
mlsPolynomialOrder=2
downsampleEnabled=true
voxelLeafSizeMm=2.0
minPointsAfterProcessing=1000

[Tracking]
; 路径1+2联调：7+19 段；scanSegmentTotal 为全局 fallback 上限（单路径以 scan_paths totalPoints 为准）
scanSegmentTotal=144

[Bevel]
configPath=bevel/config.txt
templateDir=bevel/data/templates
angleTolDeg=2.0
lengthTolMm=1.0
; 默认型号：type0 = 45°坡口 / 钝边6mm（另 type1 = 30° / 1mm，换型时由 Qt cmd.set_bevel_recipe 下发）
defaultBevelType=0
defaultAngleDeg=45.0
defaultLengthMm=6.0
; 坡口算法离线测试（启动后自动执行一次，无需 PLC 扫描/Trig_Inspection）
; true=启用；测完看日志 [Bevel] 或 HMI event.inspection.finished
offlineReplayEnabled=true
; 支持目录（逐文件测量后取均值，不合并大点云）或单文件
offlineReplayDataDir=D:/work/兰铀/封头检测工位/算法/testdata/坡口data/data/test_data
; 须与 scan_paths 中 inspectionType=bevel 的路径 ID 一致（station1 默认 path4）
offlineReplayPathId=4
offlineReplayDelayMs=5000

[Hole]
configPath=hole/config/default.json
icpRmsMaxMm=5.0
cylinderRmsMaxMm=3.0
; 一次性联调：true=启动后自动从 session 目录加载点云跑 Hole，无需 PLC Trig_Inspection
offlineReplayEnabled=false
offlineReplaySessionDir=D:/work/LY/deploy_debug/output/session_20260626_120937
offlineReplayPathId=1
offlineReplayDelayMs=5000
offlineReplayPlyFileName=pointcloud_stitched.ply

[Thickness]
configPath=thickness/config/thickness_config.json
icpFitnessMax=50.0
; 厚度算法离线测试（启动后自动执行一次，无需 PLC 扫描/Trig_Inspection）
; true=启用；测完看日志 [Thickness] 或 HMI event.inspection.finished
offlineReplayEnabled=false
; 目录内须含 inner/outer 成对 PCD 或 PLY；也可显式指定 offlineReplayInnerCloudFile / offlineReplayOuterCloudFile
offlineReplayDataDir=D:/work/兰铀/封头检测工位/算法/testdata/厚度测量数据
offlineReplayInnerCloudFile=
offlineReplayOuterCloudFile=
; 须与 scan_paths 中 inspectionType=thickness 的路径 ID 一致（station1 默认 path5）
offlineReplayPathId=5
offlineReplayDelayMs=5000
; 离线回放专用轻量算法配置（跳过离群点去除、体素 3mm；432 万点约 1~3 分钟；生产仍用 configPath）
offlineReplayAlgorithmConfigPath=thickness/config/thickness_config_offline_fast.json

[InternalSurface]
configPath=internal_surface/config/algorithm_config.json
templateType=1
minDepthMm=0.0
minVolumeM3=0.0
; 内表面算法离线测试（启动后自动执行一次，无需 PLC 扫描/Trig_Inspection）
; true=启用；测完看日志 [InternalSurface] 或 HMI event.inspection.finished
offlineReplayEnabled=false
; 相对路径相对于 config.ini 所在目录；已复制一份到 testdata/ 避免中文路径编码问题
offlineReplayPointCloudPath=testdata/neibiaomiao/inner_surface_full.txt
; 须与 scan_paths 中 inspectionType=internal_surface 的路径 ID 一致（默认 path2）
offlineReplayPathId=2
offlineReplayDelayMs=5000
; 离线回放专用轻量算法配置（voxel 6mm / mesh 半径 28mm，27 万点约 1~3 分钟；生产仍用 configPath）
offlineReplayAlgorithmConfigPath=internal_surface/config/algorithm_config_offline_fast.json

[SelfCheck]
totalPoints=2
configPath=self_check/self_check.ini

[Hmi]
enabled=true
tcpPort=9900
; 演示/联调：true 时显控可发 cmd.debug_trigger_inspection 用缓存点云触发坡口测量（不写 PLC）
allowDebugTriggerInspection=false
; 临时演示：true 时 path1-5 全部扫完且 Trig_Inspection 末段握手完成后推送预设 headMetrics
emitPresetInspectionOnPathsComplete=false
; HMI 联调：true 时显控 TCP 连接后立即推送演示路径状态（path1/2 已完成，path3 进行中）
emitDemoScanPathStatusOnConnect=false
